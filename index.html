<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Color Scheme Generator">
    <meta name="author" content="Peter Paing">
    <title>Color Scheme Generator</title>
     <link rel="stylesheet" href="style.css">
    
</head>
<body>
<div class="main-container">
    <form>
    <input type="color">
    <select>
        <option>Monochrome</option>
        <option>Monochrome-dark</option>
        <option>Monochrome-light</option>
        <option>Analogic</option>
        <option>Complement</option>
        <option>Analogic-complement</option>
        <option>Triad</option>
    </select>
    <button type="submit">Get color scheme</button>
    </form>
</div>
</body>
</html>
